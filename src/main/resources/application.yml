spring:
  profiles:
    active: problem

  datasource:
    url: jdbc:postgresql://localhost:5432/stampede
    username: postgres
    password: postgres
    hikari:
      maximum-pool-size: 5      # 풀 고갈 유도 (모든 프로파일 동일 조건)
      minimum-idle: 2
      connection-timeout: 1000  # 1초 초과 시 예외 발생

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: localhost
      port: 6379

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  metrics:
    export:
      prometheus:
        enabled: true

---
spring:
  config:
    activate:
      on-profile: problem

cache:
  ttl: 10
  jitter: 0
  db-delay-ms: 500  # DB 쿼리 지연 시뮬레이션 (모든 solution과 동일 조건)

---
spring:
  config:
    activate:
      on-profile: solution-v1

cache:
  ttl: 10
  jitter: 0
  db-delay-ms: 500

---
spring:
  config:
    activate:
      on-profile: solution-v2

cache:
  ttl: 10
  jitter: 5
  db-delay-ms: 500

---
spring:
  config:
    activate:
      on-profile: solution-v3

cache:
  ttl: 60
  jitter: 0
  db-delay-ms: 500
  warming:
    cron: "*/5 * * * * *"
    product-ids: 1, 2, 3
